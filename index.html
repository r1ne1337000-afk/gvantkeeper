<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GvantKeeper"/>
<meta name="theme-color" content="#000"/>
<title>GvantKeeper</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif}#b{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:10px}</style>
</head><body><div id="b"><b style="font-size:22px">GvantKeeper</b><span style="color:#8e8e93;font-size:14px">Загрузка…</span></div>
<script>
(async()=>{
  const base=location.href.replace(/index\.html.*/,'').replace(/\/?$/,'/');
  try{
    const parts=await Promise.all([0,1,2].map(i=>fetch(base+'p'+i+'.txt?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()})));
    document.open();document.write(parts.join(''));document.close();
  }catch(e){
    document.getElementById('b').innerHTML='<b style="font-size:22px">GvantKeeper</b><span style="color:#ff453a">Ошибка загрузки. Обновите страницу.</span>';
  }
})();
</script></body></html>
