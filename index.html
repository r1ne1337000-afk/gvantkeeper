<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GvantKeeper"/>
<meta name="theme-color" content="#000"/>
<title>GvantKeeper</title>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<div id="lock">
  <div class="lock-logo"><svg viewBox="0 0 100 100" width="44" height="44"><path fill="white" d="M50 18L22 32v20c0 18 12 34 28 40 16-6 28-22 28-40V32L50 18z"/></svg></div>
  <div class="lock-title" id="lockTitle">GvantKeeper</div>
  <div class="lock-sub" id="lockSub">Создайте код-пароль</div>
  <div id="setupView" style="display:none;flex-direction:column;align-items:center">
    <div class="pin-dots" id="setupDots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
    <div class="status" id="setupStatus">Придумайте 4-значный код</div>
    <div class="pin-keypad" id="setupKeys"></div>
  </div>
  <div id="faceEnable" style="display:none;text-align:center;max-width:300px">
    <div class="faceid-btn" style="margin-bottom:16px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0098ea" stroke-width="1.5"><path d="M9 3H5a2 2 0 00-2 2v4M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M15 21h4a2 2 0 002-2v-4"/><circle cx="9" cy="10" r="1" fill="#0098ea"/><circle cx="15" cy="10" r="1" fill="#0098ea"/><path d="M9 15c.5 1 1.5 1.5 3 1.5s2.5-.5 3-1.5"/></svg></div>
    <div style="font-size:18px;font-weight:600;margin-bottom:8px">Включить Face ID?</div>
    <div style="color:#8e8e93;font-size:14px;margin-bottom:24px">Быстрый вход в GvantKeeper</div>
    <button class="btn btn-save" onclick="enableFace(true)">Включить</button>
    <button class="btn btn-cancel" style="margin-top:10px" onclick="enableFace(false)">Позже</button>
  </div>
  <div id="loginView" style="display:none;flex-direction:column;align-items:center">
    <div id="faceView">
      <div class="faceid-btn" id="faceBtn" onclick="doFace()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M9 3H5a2 2 0 00-2 2v4M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M15 21h4a2 2 0 002-2v-4"/><circle cx="9" cy="10" r="1" fill="#fff"/><circle cx="15" cy="10" r="1" fill="#fff"/><path d="M9 15c.5 1 1.5 1.5 3 1.5s2.5-.5 3-1.5"/></svg></div>
      <div class="status" id="faceStatus">Нажмите для Face ID</div>
      <div class="switch" onclick="showPin()">Или введите код</div>
    </div>
    <div id="pinView" style="display:none;flex-direction:column;align-items:center">
      <div class="pin-dots" id="pinDots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
      <div class="status" id="pinStatus">Введите код-пароль</div>
      <div class="pin-keypad" id="pinKeys"></div>
      <div class="switch" onclick="showFace()">Face ID</div>
    </div>
  </div>
</div>
<div class="phone" id="app" style="display:none">
  <div class="screen active" id="home">
    <div class="header">
      <div class="icon-btn" onclick="toast('Сканер QR')">QR</div>
      <div class="wallet-name" id="wName" onclick="openSettings()">GvantKeeper</div>
      <div class="icon-btn" onclick="openSettings()">Set</div>
    </div>
    <div class="balance">
      <div class="balance-amount" id="bal">$0.00</div>
      <div class="balance-sub" id="addr">UQCb…ML46</div>
    </div>
    <div class="actions">
      <div class="action-btn" onclick="toast('Отправить')"><div class="action-icon">Up</div><span>Отправить</span></div>
      <div class="action-btn" onclick="toast('Пополнить')"><div class="action-icon">Down</div><span>Пополнить</span></div>
      <div class="action-btn" onclick="toast('Обменять')"><div class="action-icon">Swap</div><span>Обменять</span></div>
      <div class="action-btn" onclick="toast('Стейкинг')"><div class="action-icon">Stake</div><span>Стейкинг</span></div>
    </div>
    <div class="tokens" id="tokenList"></div>
  </div>
  <div class="nav">
    <div class="nav-item active"><span>W</span>Кошелёк</div>
    <div class="nav-item" onclick="toast('Трейд')"><span>T</span>Трейд</div>
    <div class="nav-item" onclick="toast('Браузер')"><span>B</span>Браузер</div>
  </div>
</div>
<div class="modal-overlay" id="settings">
  <div class="modal">
    <div style="font-size:18px;font-weight:600;text-align:center;margin-bottom:16px">Настройки</div>
    <label style="color:var(--text2);font-size:13px">Имя</label>
    <input id="inName" type="text"/>
    <label style="color:var(--text2);font-size:13px">Баланс ($)</label>
    <input id="inBal" type="number" step="0.01"/>
    <label style="color:var(--text2);font-size:13px">TON</label>
    <input id="inTon" type="number" step="0.01"/>
    <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
    <button class="btn btn-cancel" onclick="closeSettings()">Закрыть</button>
    <button class="btn btn-cancel" onclick="resetPin()">Сменить код / Face ID</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
